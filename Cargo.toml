[workspace]
members = ["crates/pixhift-core", "src-tauri"]
exclude = ["src-tauri/vendor/avif-decode"]
default-members = ["src-tauri", "crates/pixhift-core"]
resolver = "3"

[workspace.dependencies]
avif-decode = { path = "src-tauri/vendor/avif-decode" }

[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 1
