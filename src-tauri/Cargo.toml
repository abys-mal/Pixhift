[package]
name = "pixhift"
version = "1.0.0"
license = "Unlicense"
edition = "2024"
rust-version = "1.98"
publish = false

[build-dependencies]
tauri-build = "2"

[dependencies]
anyhow = "1"
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
csv = "1"
ctrlc = "3"
pixhift-core = { path = "../crates/pixhift-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
